name: Build Android Clock App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout代码
      uses: actions/checkout@v4
    
    - name: 设置JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: 授予gradlew执行权限
      run: chmod +x gradlew
    
    - name: 构建Debug APK
      run: ./gradlew assembleDebug --stacktrace
    
    - name: 上传APK到构建产物
      uses: actions/upload-artifact@v4
      with:
        name: ClockApp-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
