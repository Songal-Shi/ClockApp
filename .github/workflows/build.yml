name: Build Android Clock App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # 允许手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout代码
      uses: actions/checkout@v4
    
    - name: 设置JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: 设置Android SDK
      uses: android-actions/setup-android@v3
    
    - name: 授予gradlew执行权限
      run: chmod +x gradlew
    
    - name: 构建Debug APK
      run: ./gradlew assembleDebug
    
    - name: 上传APK到构建产物
      uses: actions/upload-artifact@v4
      with:
        name: ClockApp-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
    
    - name: 构建Release APK（可选）
      run: ./gradlew assembleRelease
      continue-on-error: true
    
    - name: 上传Release APK（可选）
      uses: actions/upload-artifact@v4
      if: success()
      continue-on-error: true
      with:
        name: ClockApp-Release-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
